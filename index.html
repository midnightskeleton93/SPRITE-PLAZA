<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sprite Plaza</title>
<style>
  :root {
    --bg: #0B0914;
    --card-bg: #161125;
    --text: #FFFFFF;
    --text-muted: #9A8FBC;
    --purple: #8B5CF6;
    --purple-light: #A78BFA;
    --border: #2A2144;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
  
  header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
  .logo-container { display: flex; align-items: center; gap: 12px; }
  .logo-text { font-size: 1.2rem; font-weight: 900; font-style: italic; text-transform: uppercase; line-height: 1; }
  .logo-text span { color: var(--purple); display: block; }

  .section { display: none; padding: 0 20px; }
  .section.active { display: block; }

  /* HOME MENU */
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .menu-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 16px; cursor: pointer; }
  .menu-card h3 { font-size: 1rem; margin-bottom: 4px; }
  
  /* SPRITE PLAZA */
  .season-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
  .season-tab {
    background: var(--card-bg); border: 1px solid var(--border);
    color: var(--text-muted); padding: 8px 16px; border-radius: 12px;
    font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .season-tab.active { background: var(--purple); color: #fff; border-color: var(--purple); }

  .sprite-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .sprite-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 14px; }
  
  .sprite-img {
    width: 56px; height: 56px; border-radius: 12px;
    background: rgba(255,255,255,0.05); object-fit: contain; padding: 4px; flex-shrink: 0;
  }
  .sprite-info { flex: 1; }
  .sprite-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; }
  .variants-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .v-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--bg);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    padding: 2px; position: relative;
  }
  .v-btn img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
  .v-btn[data-state="owned"] { border-color: #22c55e; }
  .v-btn[data-state="mastered"] { border-color: #eab308; }
  .v-btn[data-state="missing"] { opacity: 0.4; filter: grayscale(100%); }

  /* COMING SOON */
  .coming-soon { text-align: center; padding: 60px 20px; background: var(--card-bg); border-radius: 24px; border: 1px dashed var(--purple); margin-top: 20px; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #0F0B1A;
    display: flex; justify-content: space-around;
    padding: 12px 0 20px 0;
    border-top: 1px solid var(--border);
    z-index: 100;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--text-muted); font-size: 0.65rem; font-weight: 600;
    cursor: pointer; background: none; border: none; transition: color 0.15s;
  }
  .nav-item.active { color: var(--purple); }
  .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <div class="logo-text">Sprite<span>Plaza</span></div>
  </div>
</header>

<main>
  <!-- HOME TAB -->
  <section class="section active" id="home">
    <div class="menu-grid">
      <div class="menu-card" onclick="switchTab('sprite-plaza')">
        <h3>Sprite Plaza</h3>
        <p>Browse and collect</p>
      </div>
      <div class="menu-card" onclick="switchTab('trading-plaza')">
        <h3>Trading Plaza</h3>
        <p>Trade with players</p>
      </div>
    </div>
  </section>

  <!-- SPRITE PLAZA TAB -->
  <section class="section" id="sprite-plaza">
    <div class="season-tabs" id="seasonTabs"></div>
    <div class="sprite-list" id="grid"></div>
  </section>

  <!-- TRADING PLAZA TAB -->
  <section class="section" id="trading-plaza">
    <div class="coming-soon">
      <h2>🚧 Coming Soon</h2>
      <p>The Trading Plaza is currently under construction.</p>
    </div>
  </section>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" data-target="home" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    Home

  <button class="nav-item" data-target="sprite-plaza" onclick="switchTab('sprite-plaza')">
    <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
    Sprite Plaza
  </button>
  <button class="nav-item" data-target="trading-plaza" onclick="switchTab('trading-plaza')">
    <svg viewBox="0 0 24 24"><path d="M19 7l-4-4-4 4h3v6H4v2h10v6h3v-6h3v-2h-3V7z"/></svg>
    Trading

</nav>

const SEASON_LABELS = { mini: "Treasure Hunters", c7s4: "C7 S4", c7s3: "C7 S3" };
let activeSeason = "mini";

function switchTab(tabId) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  const navBtn = document.querySelector(`.nav-item[data-target="${tabId}"]`);
  if (navBtn) navBtn.classList.add('active');
}

function renderSeasonTabs() {
  const wrap = document.getElementById("seasonTabs");
  wrap.innerHTML = "";
  Object.keys(SEASON_LABELS).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "season-tab" + (activeSeason === key ? " active" : "");
    btn.textContent = SEASON_LABELS[key];
    btn.onclick = () => { activeSeason = key; renderSeasonTabs(); renderGrid(); };
    wrap.appendChild(btn);
  });
}

function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  
  (SPRITE_DATA[activeSeason] || []).forEach(s => {
    const card = document.createElement("div");
    card.className = "sprite-card";

    const img = document.createElement("img");
    img.className = "sprite-img";
    img.src = s.image; 
    
    const info = document.createElement("div");
    info.className = "sprite-info";
    info.innerHTML = `<div class="sprite-title">${s.name}</div>`;

    const vRow = document.createElement("div");
    vRow.className = "variants-row";
    
    s.variants.forEach(v => {
      const btn = document.createElement("div");
      btn.className = "v-btn";
      btn.dataset.label = v.name;
      
      const vImg = document.createElement("img");
      vImg.src = v.img;
      btn.appendChild(vImg);
      vRow.appendChild(btn);
    });

    info.appendChild(vRow);
    card.appendChild(img);
    card.appendChild(info);
    grid.appendChild(card);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  renderSeasonTabs();
  renderGrid();
  switchTab('home'); 
});

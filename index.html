<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sprite Plaza — by Midnight</title>
<style>
  :root {
    --bg: #121212;
    --panel: #1f1f23;
    --panel-hover: #2a2a30;
    --text: #ffffff;
    --muted: #a0a0a5;
    --accent: #facc15;
    --owned: #22c55e;
    --mastered: #eab308;
    --missing: #3f3f46;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  
  header {
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 0.5px; }
  
  .section-tabs {
    display: flex; gap: 8px; background: var(--bg);
    border-bottom: 1px solid #333; padding: 12px 24px;
  }
  .section-tab {
    padding: 8px 16px; border-radius: 8px; border: none; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 0.9rem; font-weight: 600;
    transition: all 0.15s;
  }
  .section-tab:hover { color: var(--text); background: #2a2a30; }
  .section-tab.active { color: var(--bg); background: var(--accent); }

  main { padding: 20px 24px 60px; max-width: 900px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; }

  .season-tabs {
    display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center;
  }
  .season-tab {
    padding: 6px 16px; border-radius: 6px; border: 1px solid #444;
    background: var(--panel); color: var(--muted); cursor: pointer;
    font-size: 0.85rem; font-weight: 600; transition: all 0.15s;
  }
  .season-tab:hover { border-color: #666; color: var(--text); }
  .season-tab.active { background: #fff; color: #000; border-color: #fff; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: var(--panel); padding: 12px; border-radius: 10px;
    margin-bottom: 20px;
  }
  .toolbar input[type="text"] {
    background: #121212; border: 1px solid #444; color: var(--text);
    padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; flex: 1;
  }
  .toolbar select {
    background: #121212; border: 1px solid #444; color: var(--text);
    padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; outline: none;
  }

  .progress-wrap {
    display: flex; justify-content: center; gap: 20px; margin-bottom: 24px;
  }
  .progress-box {
    background: var(--panel); border-radius: 8px; padding: 8px 24px;
    text-align: center; border: 1px solid #333;
  }
  .progress-num { font-size: 1.2rem; font-weight: 700; }
  .progress-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  .sprite-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 12px;
  }

  .sprite-card {
    background: var(--panel); border-radius: 8px;
    display: flex; align-items: center; padding: 10px 14px;
    gap: 16px; border: 1px solid #2a2a30;
  }
  .sprite-img-container {
    width: 54px; height: 54px; flex-shrink: 0;
    background: #121212; border-radius: 6px; padding: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .sprite-img-container img {
    width: 100%; height: 100%; object-fit: contain;
  }
  .sprite-info { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .sprite-title { font-size: 0.95rem; font-weight: 700; line-height: 1; }
  
  .variants-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .v-btn {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--missing); background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: transparent; transition: all 0.15s;
    position: relative;
  }
  .v-btn::after {
    content: attr(data-label);
    position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%);
    background: #000; color: #fff; font-size: 0.65rem; padding: 2px 6px;
    border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.15s; text-transform: capitalize; z-index: 10;
  }
  .v-btn:hover::after { opacity: 1; }
  .v-btn:hover { border-color: #888; }
  
  .v-btn[data-state="owned"] { border-color: var(--owned); background: var(--owned); color: #fff; }
  .v-btn[data-state="mastered"] { border-color: var(--mastered); background: var(--mastered); color: #000; }

  .panel {
    background: var(--panel); border: 1px solid #333; border-radius: 10px;
    padding: 16px; margin-top: 24px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 1rem; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button.main-btn {
    background: var(--accent); color: var(--bg); border: none; padding: 8px 16px;
    border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 700;
  }
  button.main-btn:hover { filter: brightness(1.1); }
  button.secondary { background: #333; color: var(--text); border: none; }
  button.danger { background: var(--danger); color: #fff; border: none; }
  .export-box { margin-top: 10px; display: none; }
  .export-box textarea {
    width: 100%; min-height: 120px; background: #121212; color: var(--text);
    border: 1px solid #444; border-radius: 6px; padding: 10px;
    font-family: ui-monospace, monospace; font-size: 0.75rem;
  }

  .coming-soon {
    background: var(--panel); border: 1px dashed var(--accent); border-radius: 12px;
    padding: 60px 24px; text-align: center; margin-top: 20px;
  }
  .coming-soon h2 { margin: 0 0 12px; font-size: 1.6rem; }
  .coming-soon p { color: var(--muted); font-size: 0.95rem; max-width: 500px; margin: 0 auto; line-height: 1.5; }

  .profile-card {
    background: var(--panel); border: 1px solid #333; border-radius: 12px;
    padding: 24px; margin-top: 20px;
  }
  .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .profile-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: bold;
  }
  .profile-name { font-size: 1.2rem; font-weight: 700; }
  .profile-sub { color: var(--muted); font-size: 0.85rem; }
  .profile-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px; margin-top: 16px;
  }
  .stat-box {
    background: #121212; border: 1px solid #333; border-radius: 8px;
    padding: 14px; text-align: center;
  }
  .stat-box .num { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .stat-box .lbl { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 20px; }
  @media (max-width: 600px) {
    main { padding: 14px 14px 50px; }
    .sprite-list { grid-template-columns: 1fr; }
  }
</style>
</head>

<header>
  <div>
    <h1>SPRITE PLAZA</h1>
  </div>
</header>

<nav class="section-tabs">
  <button class="section-tab active" data-section="sprite-plaza">Sprite Plaza</button>
  <button class="section-tab" data-section="trading-plaza">Trading Plaza</button>
  <button class="section-tab" data-section="profile">Profile</button>
</nav>

<main>
  <section class="section active" id="sprite-plaza">
    
    <div class="season-tabs" id="seasonTabs"></div>

    <div class="progress-wrap">
      <div class="progress-box">
        <div class="progress-num" id="progressText">0 / 0</div>
        <div class="progress-lbl">Owned</div>
      </div>
      <div class="progress-box">
        <div class="progress-num" id="masteredText">0 / 0</div>
        <div class="progress-lbl">Mastered</div>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="search" placeholder="Search Sprites..." />
      <select id="filterState">
        <option value="all">All</option>
        <option value="owned">Owned</option>
        <option value="mastered">Mastered</option>
        <option value="missing">Missing</option>
      </select>
      <select id="filterRarity">
        <option value="all">All Rarities</option>
        <option value="Rare">Rare</option>
        <option value="Epic">Epic</option>
        <option value="Legendary">Legendary</option>
        <option value="Mythic">Mythic</option>
      </select>
    </div>

    <div class="sprite-list" id="grid"></div>

    <div class="panel">
      <h2>Export collection</h2>
      <div class="btn-row">
        <button class="main-btn" id="exportText">Export as text</button>
      </div>
      <div class="export-box" id="exportBox">
        <textarea id="exportArea" readonly></textarea>
      </div>
    </div>

    <div class="panel">
      <h2>Danger zone</h2>
      <div class="btn-row">
        <button class="danger" id="wipeAll">Wipe all data</button>
      </div>
    </div>
  </section>

  <section class="section" id="trading-plaza">
    <div class="coming-soon">
      <h2>🚧 Coming Soon</h2>
      <p>The Trading Plaza is currently under construction.</p>
    </div>
  </section>

  <section class="section" id="profile">
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar">M</div>
        <div>
          <div class="profile-name">Midnight</div>
          <div class="profile-sub">Sprite Plaza Creator</div>
        </div>
      </div>
      <div class="profile-stats">
        <div class="stat-box">
          <div class="num" id="profileCollected">0</div>
          <div class="lbl">Owned Variants</div>
        </div>
        <div class="stat-box">
          <div class="num" id="profileMastered">0</div>
          <div class="lbl">Mastered Variants</div>
        </div>
        <div class="stat-box">
          <div class="num" id="profileTotal">0</div>
          <div class="lbl">Total Variants</div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>Sprite Plaza · fan-made tracker · not affiliated with Epic Games</footer>

const SEASON_LABELS = { mini: "Treasure Hunters", c7s4: "C7 S4", c7s3: "C7 S3" };
const PREFIXES = { mini: "th_", c7s4: "s4_", c7s3: "s3_" };
const STORAGE_KEY = "spritePlaza.v7";

let store = { ticks: {}, activeSeason: "mini" };

function getImagePath(season, spriteId, variant) {
  const prefix = PREFIXES[season] || "";
  return `${IMG_PATH}${prefix}${spriteId}_${variant}.${IMG_EXT}`;
}

function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      store.ticks = p.ticks || {};
      store.activeSeason = p.activeSeason || "mini";
    }
  } catch (e) { console.warn(e); }
}
function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
  catch (e) { console.warn(e); }
}

function getVariantState(spriteId, variant) {
  return store.ticks[`${spriteId}_${variant}`] || "missing";
}

function cycleVariantState(spriteId, variant) {
  const key = `${spriteId}_${variant}`;
  const cur = getVariantState(spriteId, variant);
  if (cur === "missing") store.ticks[key] = "owned";
  else if (cur === "owned") store.ticks[key] = "mastered";
  else delete store.ticks[key];
  saveStore();
}

function seasonSprites() { return SPRITE_DATA[store.activeSeason] || []; }

function filteredSprites() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const fState = document.getElementById("filterState").value;
  const fRarity = document.getElementById("filterRarity").value;
  
  return seasonSprites().filter(s => {
    if (q && !s.name.toLowerCase().includes(q)) return false;
    if (fRarity !== "all" && s.rarity !== fRarity) return false;
    
    if (fState !== "all") {
      const states = s.variants.map(v => getVariantState(s.id, v));
      if (fState === "missing" && !states.every(st => st === "missing")) return false;
      if (fState === "owned" && !states.some(st => st === "owned" || st === "mastered")) return false;
      if (fState === "mastered" && !states.some(st => st === "mastered")) return false;
    }
    return true;
  });
}

function renderSeasonTabs() {
  const wrap = document.getElementById("seasonTabs");
  wrap.innerHTML = "";
  Object.keys(SEASON_LABELS).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "season-tab" + (store.activeSeason === key ? " active" : "");
    btn.textContent = SEASON_LABELS[key];
    btn.onclick = () => { store.activeSeason = key; saveStore(); renderAll(); };
    wrap.appendChild(btn);
  });
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const list = filteredSprites();
  grid.innerHTML = "";

  list.forEach(s => {
    const card = document.createElement("div");
    card.className = "sprite-card";

    const imgContainer = document.createElement("div");
    imgContainer.className = "sprite-img-container";
    
    const img = document.createElement("img");
    img.src = getImagePath(store.activeSeason, s.id, "base");
    img.alt = s.name;
    img.onerror = () => { 
      img.style.display = 'none'; 
      imgContainer.textContent = s.name.charAt(0);
      imgContainer.style.fontSize = "1.5rem";
      imgContainer.style.fontWeight = "bold";
    };
    imgContainer.appendChild(img);

    const info = document.createElement("div");
    info.className = "sprite-info";

    const title = document.createElement("div");
    title.className = "sprite-title";
    title.textContent = s.name;

    const vRow = document.createElement("div");
    vRow.className = "variants-row";

    s.variants.forEach(v => {
      const state = getVariantState(s.id, v);
      const btn = document.createElement("div");
      btn.className = "v-btn";
      btn.dataset.state = state;
      btn.dataset.label = v;
      
      if (state === "owned") btn.textContent = "✓";
      if (state === "mastered") btn.textContent = "♛";
      
      btn.onclick = () => { 
        cycleVariantState(s.id, v); 
        renderAll(); 
      };
      vRow.appendChild(btn);
    });

    info.appendChild(title);
    info.appendChild(vRow);
    card.appendChild(imgContainer);
    card.appendChild(info);
    grid.appendChild(card);
  });
}

function renderProgress() {
  const all = seasonSprites();
  let total = 0, owned = 0, mastered = 0;

  all.forEach(s => {
    s.variants.forEach(v => {
      total++;
      const st = getVariantState(s.id, v);
      if (st === "owned") owned++;
      if (st === "mastered") mastered++;
    });
  });

  document.getElementById("progressText").textContent = `${owned + mastered} / ${total}`;
  document.getElementById("masteredText").textContent = `${mastered} / ${total}`;
}

function updateProfileStats() {
  let collected = 0, mastered = 0, total = 0;
  Object.keys(SPRITE_DATA).forEach(k => {
    SPRITE_DATA[k].forEach(s => {
      s.variants.forEach(v => {
        total++;
        const st = getVariantState(s.id, v);
        if (st === "owned") collected++;
        if (st === "mastered") mastered++;
      });
    });
  });
  document.getElementById("profileCollected").textContent = collected;
  document.getElementById("profileMastered").textContent = mastered;
  document.getElementById("profileTotal").textContent = total;
}

function renderAll() {
  renderSeasonTabs();
  renderGrid();
  renderProgress();
  updateProfileStats();
}

function showTextExport() {
  let out = `SPRITE PLAZA — ${SEASON_LABELS[store.activeSeason]}\n`;
  out += `Exported: ${new Date().toLocaleString()}\n\n`;

  seasonSprites().forEach(s => {
    const owned = [], mastered = [], missing = [];
    s.variants.forEach(v => {
      const st = getVariantState(s.id, v);
      if (st === "owned") owned.push(v);
      else if (st === "mastered") mastered.push(v);
      else missing.push(v);
    });
    
    if (owned.length || mastered.length) {
      out += `== ${s.name} ==\n`;
      if (owned.length) out += `- Owned: ${owned.join(", ")}\n`;
      if (mastered.length) out += `- Mastered: ${mastered.join(", ")}\n`;
      out += "\n";
    }
  });

  const box = document.getElementById("exportBox");
  const area = document.getElementById("exportArea");
  area.value = out;
  box.style.display = "block";
  area.focus();
  area.select();
}

function initSections() {
  document.querySelectorAll(".section-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".section-tab").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.section).classList.add("active");
    });
  });
}

function init() {
  loadStore();
  renderAll();
  initSections();

  document.getElementById("search").addEventListener("input", renderGrid);
  document.getElementById("filterState").addEventListener("change", renderGrid);
  document.getElementById("filterRarity").addEventListener("change", renderGrid);
  document.getElementById("exportText").addEventListener("click", showTextExport);
  
  document.getElementById("wipeAll").addEventListener("click", () => {
    if (!confirm("Wipe all ticks and settings?")) return;
    store = { ticks: {}, activeSeason: "mini" };
    localStorage.removeItem(STORAGE_KEY);
    renderAll();
    document.getElementById("exportBox").style.display = "none";
  });
}

init();
</script>
</body>
</html>
